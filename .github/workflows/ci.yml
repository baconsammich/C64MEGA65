name: CI

# Simulation-level regression gate. This is deliberately cheap (well under a
# minute) and does NOT replace synthesis or the hardware tests in tests/ - it
# catches VHDL defects that a successful Vivado build does not, because GHDL
# enforces parts of the LRM that Vivado lets slide.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # OSS CAD Suite release used for Verilator. Bump deliberately.
  OSS_CAD_DATE: "2026-10-09"

jobs:
  simulate:
    name: GHDL analysis and testbenches
    runs-on: ubuntu-latest

    steps:
      - name: Check out the core (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned to an upstream build rather than Ubuntu's package: GHDL 4.1.0 as
      # shipped by Ubuntu crashes inside its own GHW waveform writer on
      # tb_sw_cartridge_wrapper ("raised CONSTRAINT_ERROR : grt-avhpi.adb:593").
      # The mcode backend needs no gcc or llvm, only libgnat at runtime.
      - name: Install GHDL
        env:
          GHDL_VERSION: 6.0.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgnat-13
          curl -fsSL -o /tmp/ghdl.tar.gz \
            "https://github.com/ghdl/ghdl/releases/download/v$GHDL_VERSION/ghdl-mcode-$GHDL_VERSION-ubuntu24.04-x86_64.tar.gz"
          mkdir -p "$HOME/ghdl"
          tar xzf /tmp/ghdl.tar.gz -C "$HOME/ghdl" --strip-components=1
          # Add the real bin directory, not a symlink: GHDL derives the location
          # of its std/ieee libraries from the path of the running binary.
          echo "$HOME/ghdl/bin" >> "$GITHUB_PATH"
          "$HOME/ghdl/bin/ghdl" --version

      - name: Check out external simulation dependencies
        env:
          # Must be a revision whose cpu_65c02 matches core_sim.vhd. See the
          # "Running the VHDL testbenches" section of doc/developer.md.
          C65C02_REV: caec0fc
        run: |
          git clone --no-checkout https://github.com/MJoergen/65c02.git "$HOME/65c02"
          git -C "$HOME/65c02" checkout "$C65C02_REV"
          git clone --depth 1 https://github.com/fransschreuder/xpm_vhdl.git "$HOME/xpm_vhdl"
          mkdir -p "$HOME/crt"
          # Export for every later step, so the paths are defined in one place.
          echo "C65C02_DIR=$HOME/65c02"     >> "$GITHUB_ENV"
          echo "XPM_TOP_DIR=$HOME/xpm_vhdl" >> "$GITHUB_ENV"
          echo "CRT_DIR=$HOME/crt"          >> "$GITHUB_ENV"

      - name: Generate the C64 ROM binary that core_sim.vhd expects
        working-directory: CORE/vhdl/test
        run: ./make_rom_bin.sh

      - name: Generate synthetic cartridge images
        working-directory: CORE/vhdl/test
        run: |
          ./make_synthetic_crt.py --type generic8  -o "$CRT_DIR/generic8.crt"
          ./make_synthetic_crt.py --type generic16 -o "$CRT_DIR/generic16.crt"
          ./make_synthetic_crt.py --type ocean     -o "$CRT_DIR/ocean.crt"

      # The C_MENU_* constants are absolute indices into the on-screen menu, so
      # inserting a menu line silently shifts them. Nothing else in the build
      # catches it - the core boots and then acts on the wrong menu item.
      - name: Check the menu indices
        working-directory: CORE/vhdl/test
        run: ./check_menu.sh

      # Elaborating every entity type-checks each one's whole dependency tree.
      # Fails only on a regression against the documented expected-failure list.
      - name: Elaborate every VHDL entity
        working-directory: CORE/vhdl/test
        run: ./analyze_all.sh

      # The vendored C1581 needs --std=93 -fsynopsys -frelaxed, so it has its
      # own gate rather than joining the one above.
      - name: Elaborate the vendored C1581
        working-directory: CORE/vhdl/test
        run: ./analyze_1581.sh

      # GHDL cannot read Verilog, which leaves the ~70 Verilog and
      # SystemVerilog files of the MiSTer core unchecked. Verilator covers them.
      #
      # Pinned rather than taken from apt: Verilator 5.020, as packaged by
      # Ubuntu 24.04, cannot parse an unpacked array with an assignment-pattern
      # initialiser ("wire [4:0] gcr_lut[16] = '{...}"), which c1541_gcr.sv and
      # c1541_track.sv both use. The OSS CAD Suite ships a current Verilator.
      - name: Cache the OSS CAD Suite
        id: cache-oss-cad
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_DATE }}

      - name: Install the OSS CAD Suite (for Verilator)
        if: steps.cache-oss-cad.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/oss-cad.tgz \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_DATE/oss-cad-suite-linux-x64-${OSS_CAD_DATE//-/}.tgz"
          mkdir -p "$HOME/oss-cad-suite"
          tar xzf /tmp/oss-cad.tgz -C "$HOME/oss-cad-suite" --strip-components=1

      - name: Lint the Verilog sources
        working-directory: CORE/vhdl/test
        # Passed explicitly rather than put on PATH: the suite also ships a
        # gcc-backend ghdl, which would shadow the pinned mcode build above and
        # then fail for want of a C compiler.
        run: VERILATOR="$HOME/oss-cad-suite/bin/verilator" ./lint_verilog.sh

      # Self-contained and self-checking: builds its own stimulus and asserts
      # on the results, so it needs no external cartridge file.
      - name: Run tb_crt_parser
        working-directory: CORE/vhdl/test
        run: make sim DUT=crt_parser

      - name: Run tb_sw_cartridge_wrapper against each synthetic cartridge
        working-directory: CORE/vhdl/test
        run: |
          for crt in generic8 generic16 ocean; do
            echo "::group::$crt"
            make clean
            make sim DUT=sw_cartridge_wrapper CRT_FILE="$crt.crt"
            # The parse must actually succeed. A clean exit is not enough on
            # its own: a truncated or rejected image still ends tidily.
            grep -q "Finished parsing CRT file" output.txt \
              || { echo "::error::$crt did not parse"; exit 1; }
            echo "::endgroup::"
          done

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waveforms
          path: CORE/vhdl/test/*.ghw
          if-no-files-found: ignore
          retention-days: 7
